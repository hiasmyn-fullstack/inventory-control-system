<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center text-primary mb-4">Controle de Estoque</h1>
        
        <div class="card p-4 mb-4 shadow-sm">
            <h5 class="mb-3">Cadastrar produto</h5>
            <form action="/cadastrar" method="POST" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="quantidade" class="form-control" placeholder="Quantidade" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" name="preco" class="form-control" placeholder="Preço" required>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-success w-100">Adicionar</button>
                </div>
            </form>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in produtos %}
                        {% if p[2] <= 3 %}
                        <tr class="table-warning">
                        {% else %}
                        <tr>
                        {% endif %}
                            <td>{{ p[0] }}</td>
                            <td>{{ p[1] }}</td>
                            <td><strong>{{ p[2] }}</strong></td>
                            <td>R$ {{ "%.2f"|format(p[3]) }}</td>
                            <td>
                                <a href="/entrada/{{ p[0] }}" class="btn btn-sm btn-primary">+</a>
                                <a href="/saida/{{ p[0] }}" class="btn btn-sm btn-danger">-</a>
								 <a href="/excluir/{{ p[0] }}" class="btn btn-sm btn-dark" onclick="return confirm('Tem certeza?')">Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="text-center text-muted py-3">Nenhum produto cadastrado</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
